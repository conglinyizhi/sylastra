name: Build Binary

on:
  workflow_dispatch:

jobs:
  build:
    name: Build sylastra binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -buildvcs=false -o dist/sylastra-linux-amd64 ./cmd/sylastra

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sylastra-linux-amd64
          path: dist/sylastra-linux-amd64
          if-no-files-found: error
